name: Push database migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      run_repair:
        description: >-
          One-off. 'diagnose' dumps the real remote schema and migration
          history (read-only, no changes) so we know ground truth instead of
          guessing. Remove this input and the diagnose job once done.
        required: false
        default: "no"

# A bad migration mutates production data, so only ever run migrations
# forward (never `supabase db reset`), and never let two pushes race.
concurrency:
  group: supabase-db-push
  cancel-in-progress: false

jobs:
  push:
    if: github.event.inputs.run_repair != 'diagnose'
    runs-on: ubuntu-latest
    # Configure this environment under Settings -> Environments with a
    # required reviewer if you want a human approval gate before migrations
    # reach the live project. With no protection rules configured, the job
    # runs straight through.
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Push migrations
        run: supabase db push

  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_repair == 'diagnose'
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migration history (local vs remote, per tracking table)
        run: supabase migration list

      - name: Actual remote schema (ground truth, read-only)
        run: |
          supabase db dump --linked --schema public -f schema.sql
          echo "--- event_type enum values ---"
          grep -A5 "CREATE TYPE \"public\".\"event_type\"" schema.sql || echo "(enum not found)"
          echo "--- pet_jar tables ---"
          grep -n "pet_jar_submissions\|pet_jar_previews" schema.sql || echo "(not found)"
          echo "--- discord_webhooks.team_id / tile_evidence.public_url / pet_jar_submissions.public_url ---"
          grep -n "team_id.*uuid\|public_url" schema.sql || echo "(not found)"
          echo "--- teams.pet_jar_count ---"
          grep -n "pet_jar_count" schema.sql || echo "(not found)"
