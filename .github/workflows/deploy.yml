name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web

      # The project URL and anon key are public by design — Vite inlines them into
      # the bundle either way — so they are committed in web/.env.production and no
      # repo secret is required to deploy.
      #
      # Secrets of the same name still override them when set, which is the escape
      # hatch for rotating the key without a commit. They are read under different
      # names here because an unset secret expands to an empty string, and an empty
      # VITE_* variable in the environment would beat the .env.production file
      # rather than fall back to it.
      - name: Build
        env:
          SECRET_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SECRET_SUPABASE_URL" ]; then
            export VITE_SUPABASE_URL="$SECRET_SUPABASE_URL"
          fi
          if [ -n "$SECRET_SUPABASE_ANON_KEY" ]; then
            export VITE_SUPABASE_ANON_KEY="$SECRET_SUPABASE_ANON_KEY"
          fi

          # Refuse to ship a service_role / secret key. Vite inlines this value
          # into a bundle served to every player, and a secret key bypasses RLS
          # completely — it would hand out both fleets and all 100 tile answers.
          # This has happened once already: a secret key pasted into the repo
          # secret overrode the correct anon key and was published.
          case "$VITE_SUPABASE_ANON_KEY" in
            sb_secret_*)
              echo "::error::VITE_SUPABASE_ANON_KEY is a SECRET key (sb_secret_...). It bypasses RLS and must never reach the browser. Use the publishable/anon key, and rotate the leaked secret key in Supabase."
              exit 1
              ;;
          esac
          if printf '%s' "$VITE_SUPABASE_ANON_KEY" | cut -d. -f2 \
             | tr '_-' '/+' | base64 -d 2>/dev/null | grep -q 'service_role'; then
            echo "::error::VITE_SUPABASE_ANON_KEY is a service_role JWT. It bypasses RLS and must never reach the browser."
            exit 1
          fi

          npm run build --prefix web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
