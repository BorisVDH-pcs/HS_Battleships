<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HS Battleships</title>
    <!-- Relative, not root-absolute: the site is served from /HS_Battleships/
         on Pages and from / locally, and "./" resolves correctly in both. -->
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- No webfont. The interface is set in the platform's own system face,
         which already ships the optical sizing, tracking tables and legibility
         tuning a downloaded face would not match here — and costs no round
         trip on the phone a captain places their fleet from. -->
  </head>
